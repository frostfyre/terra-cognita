      display: flex; align-items: center; justify-content: center;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center; padding: 1.5rem; letter-spacing: 0.02em;
    }

  </style>
</head>
